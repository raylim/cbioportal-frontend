# cBioPortal overrides for the public WSI demo.
#
# The portal image's built-in application.properties (the upstream
# application.properties.EXAMPLE) is the base; these keys override it. ${...} values are
# resolved from the portal container's environment (see compose.yml), so no secret is
# written here.

# ClickHouse
spring.datasource.url=jdbc:ch://clickhouse:8123/cbioportal
spring.datasource.username=cbio
spring.datasource.password=${CLICKHOUSE_PASSWORD}
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
spring.profiles.active=clickhouse
clickhouse_mode=true

# No login: every study is readable by everyone who can reach the demo.
authenticate=false
session.service.url=http://session:5001/api/sessions/public_demo/

# Pages
skin.title=cBioPortal WSI public demo
skin.footer=
skin.right_logo=
skin.authorization_message=
skin.login.contact_html=
skin.login.saml.registration_html=
skin.blurb=A local demo of cBioPortal with the native whole-slide image viewer, on public TCGA data (NCI GDC) and the cBioPortal datahub.
frontend.url=${PUBLIC_ORIGIN}/frontend/
# Annotation services that need an account or a token stay off.
show.oncokb=false

# Whole-slide images: tile server, annotation service and slide assistant at <origin>/wsi
wsi.tile_server.url=${PUBLIC_ORIGIN}/wsi
wsi.annotation_api.url=${PUBLIC_ORIGIN}/wsi
wsi.agent.enabled=${WSI_AGENT_ENABLED:false}
# Signs slide capabilities (GET /api/resources/{studyId}/{resourceId}/access) and
# annotation/assistant capabilities (GET /api/wsi/access-token); the tile server holds the
# same secret.
wsi.access-token-secret=${WSI_AUTH_SECRET}
wsi.access-token-audience=cbioportal-wsi
# Without login, annotation/assistant capabilities are issued to sub=local-development.
wsi.local-auth-bypass=true
