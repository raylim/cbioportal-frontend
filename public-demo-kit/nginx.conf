# One origin for the whole demo (PUBLIC_ORIGIN, default http://localhost:27800).
server {
    listen 80;
    client_max_body_size 50m;

    # Resolve the services through Docker's DNS on every request (cached 10 s), so a
    # recreated tile or portal container is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tile tile:8080;
    set $portal portal:8080;

    # Frontend production build (the portal's frontend.url = <origin>/frontend/).
    location /frontend/ {
        alias /usr/share/nginx/frontend/;
        add_header Cache-Control "no-cache";
    }

    # Assistant chat is a server-sent event stream: no buffering.
    location ^~ /wsi/agent/chat {
        rewrite ^/wsi/(.*)$ /$1 break;
        proxy_pass http://$tile;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Tile server, annotation service and assistant (wsi.tile_server.url and
    # wsi.annotation_api.url = <origin>/wsi); the /wsi prefix is stripped.
    location ~ ^/wsi/(health|ready|tiles|thumbnails|annotations|agent|research)(/.*)?$ {
        rewrite ^/wsi/(.*)$ /$1 break;
        proxy_pass http://$tile;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }

    # Everything else (pages, /api, the /wsi/patient/... permalink page) -> cBioPortal.
    location / {
        proxy_pass http://$portal;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
